<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - Unieuro Reggio Calabria</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icona.png">
  <meta name="theme-color" content="#002D62">

  <style>
    :root {
      --unieuro-blue: #002D62;
      --unieuro-dark: #001838;
      --unieuro-orange: #FF6700;
      --bg-color: #EEF2F7;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, var(--unieuro-dark), var(--unieuro-blue));
      color: white;
      padding: 18px 22px;
      border-radius: 16px;
      border-bottom: 4px solid var(--unieuro-orange);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 18px;
      box-shadow: 0 6px 18px rgba(0, 24, 56, 0.2);
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-box img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: white;
      padding: 3px;
      object-fit: contain;
    }

    .brand-box h1 {
      font-size: 1.25rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.92; }
    .btn-orange { background: var(--unieuro-orange); color: white; }
    .btn-blue { background: var(--unieuro-blue); color: white; }
    .btn-green { background: #16A34A; color: white; }
    .btn-call { background: #0284C7; color: white; }
    .btn-red { background: #DC2626; color: white; }
    .btn-outline-light { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.4); }

    /* STATISTICHE RAPIDE */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .kpi-card {
      background: white;
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      border-left: 5px solid var(--unieuro-blue);
    }

    .kpi-card.orange { border-left-color: var(--unieuro-orange); }
    .kpi-card.green { border-left-color: #16A34A; }
    .kpi-card.purple { border-left-color: #7C3AED; }
    .kpi-card.cyan { border-left-color: #0284C7; }

    .kpi-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .kpi-value {
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--unieuro-blue);
      margin-top: 4px;
    }

    /* RIEPILOGO OPERATORI */
    .operatori-bar {
      background: white;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .op-chip {
      background: #F1F5F9;
      border: 1.5px solid #CBD5E1;
      color: #1E293B;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }

    .op-chip.active {
      background: var(--unieuro-blue);
      color: white;
      border-color: var(--unieuro-blue);
    }
